[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "spectral-index-engine"
version = "0.1.0"
description = "Deterministic scientific engine for raster spectral indices."
requires-python = ">=3.13"
dependencies = [
  "numpy==2.5.2",
  "rasterio==1.5.1",
  "spectral-index-common==0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/spectral_engine"]
