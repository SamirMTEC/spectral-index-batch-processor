[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "spectral-index-common"
version = "0.1.0"
description = "Shared runtime configuration and logging for SpectralIndex services."
requires-python = ">=3.13"
dependencies = [
  "pydantic-settings==2.15.0",
  "structlog==26.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/spectral_common"]

