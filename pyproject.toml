[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["apps/api/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
files = [
  "packages/python/src",
  "packages/science/src",
  "apps/api/src",
  "apps/worker/src",
  "tests",
]

[[tool.mypy.overrides]]
module = [
  "boto3",
  "botocore.*",
  "rasterio",
  "rasterio.*",
  "celery",
  "celery.*",
  "billiard.*",
]
ignore_missing_imports = true
