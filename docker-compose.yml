name: spectral-index

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      SPECTRAL_S3_BUCKET: ${SPECTRAL_S3_BUCKET:-spectral-index}
    entrypoint: >-
      /bin/sh -c '
      /usr/bin/mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD";
      /usr/bin/mc mb --ignore-existing local/"$$SPECTRAL_S3_BUCKET";
      /usr/bin/mc version enable local/"$$SPECTRAL_S3_BUCKET";
      /usr/bin/mc anonymous set none local/"$$SPECTRAL_S3_BUCKET";
      '

  migrate:
    image: spectral-index-api:local
    restart: "no"
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      SPECTRAL_ENVIRONMENT: ${SPECTRAL_ENVIRONMENT:-development}
      SPECTRAL_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SPECTRAL_REDIS_URL: redis://redis:6379/0
      SPECTRAL_S3_ENDPOINT_URL: http://minio:9000
      SPECTRAL_S3_REGION: ${SPECTRAL_S3_REGION:-us-east-1}
      SPECTRAL_S3_BUCKET: ${SPECTRAL_S3_BUCKET:-spectral-index}
      SPECTRAL_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      SPECTRAL_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      SPECTRAL_S3_FORCE_PATH_STYLE: "true"

  api:
    image: spectral-index-api:local
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      SPECTRAL_ENVIRONMENT: ${SPECTRAL_ENVIRONMENT:-development}
      SPECTRAL_LOG_LEVEL: ${SPECTRAL_LOG_LEVEL:-INFO}
      SPECTRAL_DEV_AUTH_ENABLED: ${SPECTRAL_DEV_AUTH_ENABLED:-true}
      SPECTRAL_AUTH0_DOMAIN: ${SPECTRAL_AUTH0_DOMAIN:-}
      SPECTRAL_AUTH0_AUDIENCE: ${SPECTRAL_AUTH0_AUDIENCE:-https://api-spectral.classlab.com.br}
      SPECTRAL_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SPECTRAL_REDIS_URL: redis://redis:6379/0
      SPECTRAL_REDIS_STREAM: ${SPECTRAL_REDIS_STREAM:-spectral:jobs}
      SPECTRAL_REDIS_CONSUMER_GROUP: ${SPECTRAL_REDIS_CONSUMER_GROUP:-spectral-workers}
      SPECTRAL_S3_ENDPOINT_URL: http://minio:9000
      SPECTRAL_S3_PUBLIC_ENDPOINT_URL: ${SPECTRAL_S3_PUBLIC_ENDPOINT_URL:-http://127.0.0.1:9000}
      SPECTRAL_S3_REGION: ${SPECTRAL_S3_REGION:-us-east-1}
      SPECTRAL_S3_BUCKET: ${SPECTRAL_S3_BUCKET:-spectral-index}
      SPECTRAL_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      SPECTRAL_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      SPECTRAL_S3_FORCE_PATH_STYLE: "true"
      SPECTRAL_UPLOAD_MULTIPART_THRESHOLD_BYTES: ${SPECTRAL_UPLOAD_MULTIPART_THRESHOLD_BYTES:-16777216}
      SPECTRAL_UPLOAD_PART_SIZE_BYTES: ${SPECTRAL_UPLOAD_PART_SIZE_BYTES:-8388608}
      SPECTRAL_UPLOAD_URL_EXPIRY_SECONDS: ${SPECTRAL_UPLOAD_URL_EXPIRY_SECONDS:-900}
      SPECTRAL_UPLOAD_SESSION_EXPIRY_SECONDS: ${SPECTRAL_UPLOAD_SESSION_EXPIRY_SECONDS:-86400}
      SPECTRAL_UPLOAD_MAX_FILES_PER_SESSION: ${SPECTRAL_UPLOAD_MAX_FILES_PER_SESSION:-10000}
      SPECTRAL_UPLOAD_MAX_FILE_BYTES: ${SPECTRAL_UPLOAD_MAX_FILE_BYTES:-53687091200}
      SPECTRAL_UPLOAD_MAX_SESSION_BYTES: ${SPECTRAL_UPLOAD_MAX_SESSION_BYTES:-107374182400}
      SPECTRAL_UPLOAD_MAX_DATASET_BYTES: ${SPECTRAL_UPLOAD_MAX_DATASET_BYTES:-1099511627776}
      SPECTRAL_API_MAX_REQUEST_BYTES: ${SPECTRAL_API_MAX_REQUEST_BYTES:-16777216}
      SPECTRAL_API_REQUEST_TIMEOUT_SECONDS: ${SPECTRAL_API_REQUEST_TIMEOUT_SECONDS:-30}
      SPECTRAL_API_WORKERS: ${SPECTRAL_API_WORKERS:-1}
      SPECTRAL_API_KEEPALIVE_SECONDS: ${SPECTRAL_API_KEEPALIVE_SECONDS:-5}
      SPECTRAL_GRACEFUL_SHUTDOWN_SECONDS: ${SPECTRAL_GRACEFUL_SHUTDOWN_SECONDS:-45}
      SPECTRAL_READINESS_TIMEOUT_SECONDS: ${SPECTRAL_READINESS_TIMEOUT_SECONDS:-5}
      SPECTRAL_API_RATE_LIMIT_REQUESTS: ${SPECTRAL_API_RATE_LIMIT_REQUESTS:-600}
      SPECTRAL_UPLOAD_RATE_LIMIT_REQUESTS: ${SPECTRAL_UPLOAD_RATE_LIMIT_REQUESTS:-60}
      SPECTRAL_RATE_LIMIT_WINDOW_SECONDS: ${SPECTRAL_RATE_LIMIT_WINDOW_SECONDS:-60}
      SPECTRAL_CORS_ORIGINS: ${SPECTRAL_CORS_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173"]}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    stop_grace_period: 60s

  worker:
    image: spectral-index-worker:local
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      SPECTRAL_ENVIRONMENT: ${SPECTRAL_ENVIRONMENT:-development}
      SPECTRAL_LOG_LEVEL: ${SPECTRAL_LOG_LEVEL:-INFO}
      SPECTRAL_DEV_AUTH_ENABLED: ${SPECTRAL_DEV_AUTH_ENABLED:-true}
      SPECTRAL_AUTH0_DOMAIN: ${SPECTRAL_AUTH0_DOMAIN:-}
      SPECTRAL_AUTH0_AUDIENCE: ${SPECTRAL_AUTH0_AUDIENCE:-https://api-spectral.classlab.com.br}
      SPECTRAL_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SPECTRAL_REDIS_URL: redis://redis:6379/0
      SPECTRAL_REDIS_STREAM: ${SPECTRAL_REDIS_STREAM:-spectral:jobs}
      SPECTRAL_REDIS_CONSUMER_GROUP: ${SPECTRAL_REDIS_CONSUMER_GROUP:-spectral-workers}
      SPECTRAL_S3_ENDPOINT_URL: http://minio:9000
      SPECTRAL_S3_REGION: ${SPECTRAL_S3_REGION:-us-east-1}
      SPECTRAL_S3_BUCKET: ${SPECTRAL_S3_BUCKET:-spectral-index}
      SPECTRAL_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      SPECTRAL_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      SPECTRAL_S3_FORCE_PATH_STYLE: "true"
      SPECTRAL_UPLOAD_MAX_DATASET_BYTES: ${SPECTRAL_UPLOAD_MAX_DATASET_BYTES:-1099511627776}
      SPECTRAL_ZIP_MAX_ENTRIES: ${SPECTRAL_ZIP_MAX_ENTRIES:-10000}
      SPECTRAL_ZIP_MAX_ENTRY_BYTES: ${SPECTRAL_ZIP_MAX_ENTRY_BYTES:-53687091200}
      SPECTRAL_ZIP_MAX_UNCOMPRESSED_BYTES: ${SPECTRAL_ZIP_MAX_UNCOMPRESSED_BYTES:-107374182400}
      SPECTRAL_ZIP_MAX_COMPRESSION_RATIO: ${SPECTRAL_ZIP_MAX_COMPRESSION_RATIO:-200}
      SPECTRAL_ZIP_MAX_PATH_DEPTH: ${SPECTRAL_ZIP_MAX_PATH_DEPTH:-16}
      SPECTRAL_RASTER_MAX_PIXELS: ${SPECTRAL_RASTER_MAX_PIXELS:-500000000}
      SPECTRAL_RASTER_MAX_BANDS: ${SPECTRAL_RASTER_MAX_BANDS:-64}
      SPECTRAL_RASTER_MAX_DECODED_BYTES: ${SPECTRAL_RASTER_MAX_DECODED_BYTES:-68719476736}
      SPECTRAL_READINESS_TIMEOUT_SECONDS: ${SPECTRAL_READINESS_TIMEOUT_SECONDS:-5}
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    stop_grace_period: 60s

  processing-worker:
    image: spectral-index-worker:local
    restart: unless-stopped
    command: ["celery"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      SPECTRAL_ENVIRONMENT: ${SPECTRAL_ENVIRONMENT:-development}
      SPECTRAL_LOG_LEVEL: ${SPECTRAL_LOG_LEVEL:-INFO}
      SPECTRAL_DEV_AUTH_ENABLED: ${SPECTRAL_DEV_AUTH_ENABLED:-true}
      SPECTRAL_AUTH0_DOMAIN: ${SPECTRAL_AUTH0_DOMAIN:-}
      SPECTRAL_AUTH0_AUDIENCE: ${SPECTRAL_AUTH0_AUDIENCE:-https://api-spectral.classlab.com.br}
      SPECTRAL_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SPECTRAL_REDIS_URL: redis://redis:6379/0
      SPECTRAL_S3_ENDPOINT_URL: http://minio:9000
      SPECTRAL_S3_REGION: ${SPECTRAL_S3_REGION:-us-east-1}
      SPECTRAL_S3_BUCKET: ${SPECTRAL_S3_BUCKET:-spectral-index}
      SPECTRAL_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      SPECTRAL_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      SPECTRAL_S3_FORCE_PATH_STYLE: "true"
      SPECTRAL_RASTER_MAX_PIXELS: ${SPECTRAL_RASTER_MAX_PIXELS:-500000000}
      SPECTRAL_RASTER_MAX_BANDS: ${SPECTRAL_RASTER_MAX_BANDS:-64}
      SPECTRAL_RASTER_MAX_DECODED_BYTES: ${SPECTRAL_RASTER_MAX_DECODED_BYTES:-68719476736}
      SPECTRAL_PROCESSING_CONCURRENCY: ${SPECTRAL_PROCESSING_CONCURRENCY:-2}
      SPECTRAL_PROCESSING_TASK_SOFT_LIMIT_SECONDS: ${SPECTRAL_PROCESSING_TASK_SOFT_LIMIT_SECONDS:-900}
      SPECTRAL_PROCESSING_TASK_HARD_LIMIT_SECONDS: ${SPECTRAL_PROCESSING_TASK_HARD_LIMIT_SECONDS:-930}
      SPECTRAL_PROCESSING_MAX_TASKS_PER_CHILD: ${SPECTRAL_PROCESSING_MAX_TASKS_PER_CHILD:-25}
      SPECTRAL_READINESS_TIMEOUT_SECONDS: ${SPECTRAL_READINESS_TIMEOUT_SECONDS:-5}
    read_only: true
    tmpfs:
      - /tmp:size=4g,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    stop_grace_period: 60s

volumes:
  postgres-data:
  redis-data:
  minio-data:
